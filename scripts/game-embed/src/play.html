<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Gamehub</title>
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <script>
      try {
        // Light, as Gamehub's own site opens, unless the visitor picked dark in a frame: never the
        // portfolio's dark page, which an iframe would otherwise take for the system's look.
        var t = localStorage.getItem('gamehub.theme.v1');
        if (t !== 'light' && t !== 'dark') {
          t = 'light';
          localStorage.setItem('gamehub.theme.v1', t);
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body class="gamehub-embed">
    <div id="root"></div>
    <script type="module" src="./embed/main.tsx"></script>
  </body>
</html>
